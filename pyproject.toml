[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanobot-manager"
version = "0.1.0"
description = "Hardened sandbox manager for Nanobot AI assistant"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
nanomanager = "nanomanager.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nanomanager"]

[tool.hatch.build]
sources = ["src"]
